android.useAndroidX=true
android.enableJetifier=true

# Godot's Android AAR is large; Jetifier transforms it during dependency resolution.
# Give the Gradle daemon enough heap for that transform and cap parallel workers
# so concurrent transforms do not exhaust the hosted runner.
org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.workers.max=2
