name: Godot 4.3 Feature Tests

on:
  push:
    branches:
      - "chatgpt/**"
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: feature-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  godot-smoke:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    timeout-minutes: 25
    steps:
      - name: Check out source with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
      - name: Restore exact bundled approved art before feature import
        run: sh .github/scripts/recover_critical_art.sh
      - name: Import project resources
        run: godot --headless --path godot-project --import --quit
      - name: Test painted Form1 sword extraction, all facings and double-sword prevention
        run: godot --headless --path godot-project --script res://scripts/form1_painted_blade_test.gd
      - name: Test grounded mortal sword pose and organic Bellhollow flagstones
        run: godot --headless --path godot-project --script res://scripts/prologue_pose_bridge_test.gd
      - name: Test approved hand-painted Bellhollow stone deck and fallback
        run: godot --headless --path godot-project --script res://scripts/bellhollow_painted_deck_test.gd
      - name: Test Bellhollow battlefield smoke and grounding ash
        run: godot --headless --path godot-project --script res://scripts/prologue_bridge_atmosphere_test.gd
      - name: Test mortal canon, sword strike and dialog/menu ownership
        run: godot --headless --path godot-project --script res://scripts/prologue_canon_combat_test.gd
      - name: Test integrated sprite-based charged sword attack
        run: godot --headless --path godot-project --script res://scripts/in_sprite_charge_test.gd
      - name: Test approval-gated twenty-strip Form 1 sword animation contract
        run: godot --headless --path godot-project --script res://scripts/form1_attack_clips_test.gd
      - name: Test visible prologue art and animations
        run: godot --headless --path godot-project --script res://scripts/prologue_visual_smoke_test.gd
      - name: Test required Android prologue PNGs resolve without placeholders
        run: godot --headless --path godot-project --script res://scripts/essential_mobile_art_test.gd
      - name: Test per-frame sprite foot grounding
        run: godot --headless --path godot-project --script res://scripts/sprite_grounding_test.gd
      - name: Test five real transparent Muse overworld residents
        run: godot --headless --path godot-project --script res://scripts/reserve_native_overworld_test.gd
      - name: Test Reserve clock, creature interaction and artwork
        run: godot --headless --path godot-project --script res://scripts/reserve_loop_test.gd
      - name: Test consent-driven encounter session, no capture or free items
        run: godot --headless --path godot-project --script res://scripts/encounter_session_test.gd
      - name: Test 12-minute day/night phase contract
        run: godot --headless --path godot-project --script res://scripts/day_night_clock_test.gd
      - name: Test living Reserve motion, shadows and awareness
        run: godot --headless --path godot-project --script res://scripts/reserve_creature_motion_test.gd
      - name: Test harmless Reserve scythe feedback
        run: godot --headless --path godot-project --script res://scripts/reserve_scythe_feedback_test.gd
      - name: Test dusk-aware garden atmosphere and light placement
        run: godot --headless --path godot-project --script res://scripts/garden_dusk_ambience_test.gd
      - name: Test garden player, companion, creature and tree depth ordering
        run: godot --headless --path godot-project --script res://scripts/garden_actor_depth_test.gd
      - name: Test Reserve discovery compass and touch-safe guidance
        run: godot --headless --path godot-project --script res://scripts/reserve_wayfinding_test.gd
      - name: Test proportional battle artwork and fallbacks
        run: godot --headless --path godot-project --script res://scripts/battle_art_fit_test.gd
      - name: Test battle return routing across every world region
        run: godot --headless --path godot-project --script res://scripts/battle_return_test.gd
      - name: Test Android joystick visibility and player HUD placement
        run: godot --headless --path godot-project --script res://scripts/mobile_touch_visibility_test.gd
      - name: Test NPC/bridge character art and display scale
        run: godot --headless --path godot-project --script res://scripts/art_test.gd
      - name: Test multi-touch controls and teardown
        run: godot --headless --path godot-project --script res://scripts/mobile_touch_test.gd
      - name: Test central mobile chat box clear of joystick and action buttons
        run: godot --headless --path godot-project --script res://scripts/mobile_dialogue_layout_test.gd
      - name: Test seamless battle touch focus and restoration
        run: godot --headless --path godot-project --script res://scripts/seamless_battle_test.gd
      - name: Test readable Android battle dialogue and two-column combat commands
        run: godot --headless --path godot-project --script res://scripts/mobile_battle_layout_test.gd
      - name: Test pause, save feedback and menu lifecycle
        run: godot --headless --path godot-project --script res://scripts/pause_menu_test.gd
      - name: Test debug APK build identity matches exact source SHA
        run: godot --headless --path godot-project --script res://scripts/build_identity_test.gd
      - name: Test cutscene input locks
        run: godot --headless --path godot-project --script res://scripts/player_input_lock_test.gd
      - name: Test movement step accounting and save migration
        run: godot --headless --path godot-project --script res://scripts/step_driver_test.gd
      - name: Test alpha-grounded painted Reserve arches and original routes
        run: godot --headless --path godot-project --script res://scripts/garden_painted_arches_test.gd
      - name: Test approved painted garden trees and refuge art alignment
        run: godot --headless --path godot-project --script res://scripts/garden_painted_landmarks_test.gd
      - name: Test painted Reserve terrain and soft route masks
        run: godot --headless --path godot-project --script res://scripts/garden_painted_ground_test.gd
      - name: Test garden routes and continue mappings
        run: godot --headless --path godot-project --script res://scripts/garden_world_test.gd
      - name: Test atomic save replacement
        run: godot --headless --path godot-project --script res://scripts/save_atomic_test.gd
      - name: Test future-version saves and safe Continue
        run: godot --headless --path godot-project --script res://scripts/save_compat_test.gd
      - name: Test playtime counting and paused-title exclusions
        run: godot --headless --path godot-project --script res://scripts/playtime_test.gd
      - name: Test shrine healing, position and save transaction
        run: godot --headless --path godot-project --script res://scripts/shrine_test.gd
      - name: Test mantle rules and shared soul-thread ledger
        run: godot --headless --path godot-project --script res://scripts/mantle_ledger_test.gd
      - name: Test Soul Credits negative-cost exploit prevention
        run: godot --headless --path godot-project --script res://scripts/credits_guard_test.gd
      - name: Test permanent creature identities through storage and saves
        run: godot --headless --path godot-project --script res://scripts/creature_identity_test.gd
      - name: Test per-individual offer memory and refusal safeguards
        run: godot --headless --path godot-project --script res://scripts/offer_memory_test.gd
      - name: Test fruit-offer spending without player-eating effects
        run: godot --headless --path godot-project --script res://scripts/fruit_offer_test.gd
      - name: Play through the critical story and gameplay path
        run: godot --headless --path godot-project --script res://scripts/playthrough_test.gd
