name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download Godot 4.3
        run: |
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          ./Godot_v4.3-stable_linux.x86_64 --version

      - name: Import project resources (headless)
        run: |
          cd godot-project
          ../Godot_v4.3-stable_linux.x86_64 --headless --import 2>&1 | tail -3

      - name: Validate new-canon Form 1 sword sprites
        run: |
          if [ -f godot-project/sprites/mollosar/approved/form1_attack_manifest.json ]; then
            python3 -m venv /tmp/rr-form1-art-env
            /tmp/rr-form1-art-env/bin/pip install --quiet Pillow numpy
            /tmp/rr-form1-art-env/bin/python .github/scripts/validate_form1_attack_art.py --require-approved
          else
            python3 .github/scripts/validate_form1_attack_art.py
          fi

      - name: Run GDScript tests (headless)
        run: |
          cd godot-project
          PASS=0
          FAIL=0
          FAILED=""
          for t in scripts/*_test.gd; do
            echo "=== $t ==="
            TEST_LOG=$(mktemp)
            if ../Godot_v4.3-stable_linux.x86_64 --headless --script "$t" > "$TEST_LOG" 2>&1 && ! grep -q '^SCRIPT ERROR:' "$TEST_LOG"; then
              PASS=$((PASS + 1))
            else
              FAIL=$((FAIL + 1))
              FAILED="$FAILED $t"
            fi
            cat "$TEST_LOG"
            rm -f "$TEST_LOG"
          done
          echo "---"
          echo "Passed: $PASS  Failed: $FAIL"
          if [ "$FAIL" -ne 0 ]; then
            echo "Failed tests:$FAILED"
            exit 1
          fi
