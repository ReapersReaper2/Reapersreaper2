name: DQ-005 packed Form 1 diagnosis
on:
  push:
    branches: [fix/dq005-packed-form1-runtime, test/dq005-packed-bridge-scene]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packed-probe:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Import exact project assets
        run: |
          godot --headless --path godot-project --import --quit
      - name: Export Android-preset resource pack
        run: |
          godot --headless --path godot-project --export-pack "Android Dev" "$GITHUB_WORKSPACE/form1-packed.pck"
          test -s "$GITHUB_WORKSPACE/form1-packed.pck"
          ls -lh "$GITHUB_WORKSPACE/form1-packed.pck"
      - name: Run ONLY from packed data (not checkout)
        run: |
          mkdir -p /tmp/form1-isolated
          cd /tmp/form1-isolated
          godot --headless --main-pack "$GITHUB_WORKSPACE/form1-packed.pck" --script res://scripts/form1_packed_export_probe.gd
          godot --headless --main-pack "$GITHUB_WORKSPACE/form1-packed.pck" --script res://scripts/dq005_bridge_packed_probe.gd
