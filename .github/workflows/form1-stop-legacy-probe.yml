name: Stop obsolete Form1 emulator probe
on:
  push:
    branches: [chatgpt/form1-playtest]
permissions:
  actions: write
jobs:
  stop-obsolete-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.actions.listWorkflowRunsForRepo({
              ...context.repo, branch: 'chatgpt/form1-playtest', per_page: 100
            });
            for (const run of data.workflow_runs) {
              if (['.github/workflows/dq005-android-emulator.yml', '.github/workflows/dq005-native-export.yml'].includes(run.path) && ['queued','in_progress','waiting'].includes(run.status)) {
                await github.rest.actions.cancelWorkflowRun({...context.repo, run_id: run.id});
                core.info(`Stopped obsolete probe ${run.id}`);
              }
            }
