name: Project Rebirth Windows Tests
on:
  push:
    branches:
      - planning/project-rebirth-20261026
      - 'candidate/rebirth-**'
    paths:
      - '.github/workflows/project-rebirth-windows.yml'
      - 'tools/testing/**'
      - 'tools/windows/**'
      - 'godot-project/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rebirth-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-godot:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare evidence and download Godot 4.3 console editor
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          "commit=$env:GITHUB_SHA`nrun=$env:GITHUB_RUN_ID`nattempt=$env:GITHUB_RUN_ATTEMPT" | Set-Content evidence/setup.txt
          $url = 'https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_win64.exe.zip'
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\godot.zip"
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\godot.zip" -DestinationPath "$env:RUNNER_TEMP\godot"
          $godot = Get-ChildItem "$env:RUNNER_TEMP\godot" -Filter '*_console.exe' -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $godot) { throw 'Godot console executable missing' }
          "GODOT_EXE=$godot" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-FileHash "$env:RUNNER_TEMP\godot.zip" | Format-List | Out-File evidence/setup.txt -Append
      - name: Test automation failure handling
        run: python -m unittest discover -s tools/testing -p 'test_*.py' -v
      - name: Full Godot 4.3 baseline
        id: baseline
        run: python tools/testing/run_godot_tests.py --godot "$env:GODOT_EXE" --output evidence/baseline
      - name: Probe graphics and capture actual gameplay
        if: ${{ !cancelled() && env.GODOT_EXE != '' }}
        run: python tools/testing/run_godot_tests.py --godot "$env:GODOT_EXE" --output evidence/capture --capture
      - name: Publish summary
        if: always()
        shell: pwsh
        run: |
          foreach ($lane in @('baseline', 'capture')) {
            $path = "evidence/$lane/manifest.json"
            if (Test-Path $path) {
              $m = Get-Content $path -Raw | ConvertFrom-Json
              "${lane}: $($m.status) — $($m.commit)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            } else { "${lane}: NOT RUN" | Out-File $env:GITHUB_STEP_SUMMARY -Append }
          }
          'Graphical evidence is diagnostic; no artistic or physical-device acceptance is implied.' | Out-File $env:GITHUB_STEP_SUMMARY -Append
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rebirth-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            evidence/
            !evidence/**/userdata/**
          if-no-files-found: error
          retention-days: 14
